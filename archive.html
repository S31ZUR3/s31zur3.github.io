<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>archive :: s31zur3</title>
    <meta name="description" content="All CTF writeups.">
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg"></canvas>

    <header class="container">
        <a class="logo" href="index.html">s31zur3<span class="dot">::</span>void</a>
        <nav>
            <a href="index.html#about">whoami</a>
            <a href="profile.html">skills</a>
            <a href="#" onclick="go('');return false;" class="active">writeups</a>
        </nav>
    </header>

    <main class="container" id="view"></main>

    <footer>
        <p><a href="index.html">← back to root</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
    <script src="data.js"></script>
    <script>
        
        const view = document.getElementById('view');
        const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        const yearOf = name => (name.match(/\d{4}/) || [''])[0];

        const { animate, stagger } = anime;

        function renderList(query = '') {
            const q = query.trim().toLowerCase();
            const groups = {};
            Object.keys(ctfData).forEach(name => {
                const ctf = ctfData[name];
                if (q && !name.toLowerCase().includes(q) && !ctf.description.toLowerCase().includes(q)) return;
                const y = yearOf(name) || 'other';
                (groups[y] ||= []).push(name);
            });

            if (!Object.keys(groups).length) {
                view.innerHTML = `
                    <div class="bar"><span class="back-btn" onclick="go('',true)">← archive</span></div>
                    <div class="empty">// no matches for "${esc(query)}"</div>`;
                animate(view.children, { y: [18, 0], opacity: [0, 1], duration: 400, ease: 'outExpo', delay: stagger(60) });
                return;
            }

            view.innerHTML = `
                <div class="sec-head"><span class="num">*</span> archive</div>
                <div class="controls">
                    <input type="text" id="search" placeholder="search ctfs, years, descriptions..." value="${esc(query)}">
                    <div class="chips">${Object.keys(groups).sort().reverse().map(y => `<span>${y}</span>`).join('')}</div>
                </div>
                ${Object.keys(groups).sort().reverse().map(y => `
                    <div class="ctf-block" data-year="${y}">
                        <div class="yr">// ${y}</div>
                        <div class="ctf-list">
                            ${groups[y].map(name => `
                                <div class="ctf-item" onclick="go('ctf/${encodeURIComponent(name)}')">
                                    <div class="name">${esc(name)}</div>
                                    <div class="rank">${esc(ctfData[name].rank)}</div>
                                    <div class="cnt">${ctfData[name].challenges.length} challenges</div>
                                </div>`).join('')}
                        </div>
                    </div>`).join('')}
            `;

            document.getElementById('search').addEventListener('input', e => {
                const q = e.target.value.trim().toLowerCase();
                view.querySelectorAll('.ctf-item').forEach(item => {
                    item.style.display = item.textContent.toLowerCase().includes(q) ? '' : 'none';
                });
                view.querySelectorAll('.ctf-block').forEach(bl =>
                    bl.style.display = [...bl.querySelectorAll('.ctf-item')].some(i => i.style.display !== 'none') ? '' : 'none');
            });

            const items = view.querySelectorAll('.ctf-item');
            animate(items, {
                y: [16, 0], opacity: [0, 1], duration: 520, ease: 'outExpo',
                delay: stagger(40, { from: 'first' })
            });
        }

        /* ctf detail */
        function renderCtf(encodedName) {
            const name = decodeURIComponent(encodedName);
            const ctf = ctfData[name];
            if (!ctf) return renderList();

            const cats = [...new Set(ctf.challenges.map(c => c.category))];
            view.innerHTML = `
                <div class="bar">
                    <span class="back-btn" onclick="go('', true)">← archive</span>
                    <span class="spacer"></span>
                    <span class="badge-rank">${esc(ctf.rank)}</span>
                </div>
                <div class="sec-head"><span class="num">#</span> ${esc(name)}</div>
                <p class="about-text" style="max-width:640px;margin-bottom:18px;">${esc(ctf.description)}</p>
                <div class="chips" id="filters">
                    <button class="chip active" data-cat="all">all (${ctf.challenges.length})</button>
                    ${cats.map(c => `<button class="chip" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
                </div>
                <div class="chall-list" id="challenges" style="margin-top:16px;">
                    ${ctf.challenges.map((c, i) => `
                        <div class="chall-item" data-cat="${esc(c.category)}"
                             onclick="go('ctf/${encodeURIComponent(name)}/${encodeURIComponent(c.id)}')">
                            <span class="title">${esc(c.title)}</span>
                            <span class="cat">${esc(c.category)}</span>
                        </div>`).join('')}
                </div>
            `;

            document.getElementById('filters').addEventListener('click', e => {
                const chip = e.target.closest('.chip'); if (!chip) return;
                document.querySelectorAll('#filters .chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                const cat = chip.dataset.cat;
                view.querySelectorAll('.chall-item').forEach(el => {
                    const show = cat === 'all' || el.dataset.cat === cat;
                    el.style.display = show ? '' : 'none';
                });
            });

            const items = view.querySelectorAll('.chall-item');
            animate(items, {
                y: [14, 0], opacity: [0, 1], duration: 480, ease: 'outExpo',
                delay: stagger(28, { from: 'first' })
            });
        }

        /* challenge writeup */
        function renderChallenge(encodedName, encodedId) {
            const name = decodeURIComponent(encodedName);
            const id = decodeURIComponent(encodedId);
            const ctf = ctfData[name];
            if (!ctf) return renderList();
            const idx = ctf.challenges.findIndex(c => c.id === id);
            if (idx === -1) return renderCtf(encodedName);
            const ch = ctf.challenges[idx];

            view.innerHTML = `
                <div class="bar">
                    <span class="back-btn" onclick="go('ctf/${encodedName}')">← ${esc(name)}</span>
                </div>
                <div class="sec-head" style="margin-top:14px;">
                    <span class="num">></span>
                    <span style="color:var(--accent)">${esc(ch.category)}</span>
                </div>
                <h1 style="font-size:28px;font-weight:700;">${esc(ch.title)}</h1>
                <div class="skills" style="margin:6px 0 16px;">
                    ${(ch.tags||[]).map(t => `<span class="pill">#${esc(t)}</span>`).join('')}
                </div>
                <div class="card writeup" style="padding:26px;">${ch.writeup}</div>
                <div class="skills" style="margin-top:20px;justify-content:space-between;">
                    ${idx > 0
                        ? `<a class="pill" onclick="go('ctf/${encodedName}/${encodeURIComponent(ctf.challenges[idx-1].id)}')">← ${esc(ctf.challenges[idx-1].title)}</a>`
                        : '<span></span>'}
                    ${idx < ctf.challenges.length - 1
                        ? `<a class="pill" onclick="go('ctf/${encodedName}/${encodeURIComponent(ctf.challenges[idx+1].id)}')">${esc(ctf.challenges[idx+1].title)} →</a>`
                        : '<span></span>'}
                </div>
            `;

            animate(view.children, {
                y: [18, 0], opacity: [0, 1], duration: 520, ease: 'outExpo',
                delay: stagger(60, { from: 'first' })
            });
        }

        /* ----- router ----- */
        let currentRoute = '';
        function go(route, force) {
            route = route || '';
            if (route === currentRoute && !force) return;
            currentRoute = route;
            window.location.hash = route;
        }

        function handleRoute() {
            const hash = location.hash.replace(/^#/, '');
            const parts = hash.split('/').map(decodeURIComponent);
            const route = (parts[0] || '');

            if (route.startsWith('ctf') && parts[2]) {
                renderChallenge(parts[1], parts[2]);
            } else if (route.startsWith('ctf') && parts[1]) {
                renderCtf(parts[1]);
            } else if (route === 'list' || route === 'writeups') {
                renderList(parts[1] || '');
            } else {
                renderList('');
            }
            window.scrollTo(0, 0);
        }

        addEventListener('hashchange', handleRoute);
        addEventListener('load', handleRoute);

        /* ----- falling-char bg (same as home) ----- */
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        let W, H, cols, drops;
        const resize = () => {
            W = canvas.width = innerWidth;
            H = canvas.height = innerHeight;
            cols = Math.floor(W / 18);
            drops = Array(cols).fill(0).map(() => Math.random() * H);
        };
        resize();
        addEventListener('resize', resize);
        const glyphs = '010s31zur301CTF{';
        (function draw() {
            ctx.fillStyle = 'rgba(10,10,12,0.12)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(249,168,212,0.22)';
            ctx.font = '13px monospace';
            for (let i = 0; i < cols; i++) {
                const ch = glyphs[(Math.random() * glyphs.length) | 0];
                ctx.fillText(ch, i * 18, drops[i]);
                if (drops[i] > H && Math.random() > 0.975) drops[i] = 0;
                drops[i] += 1.2;
            }
            requestAnimationFrame(draw);
        })();

        // expose for inline onclick
        window.go = go;
        window.renderCtf = renderCtf;
        window.renderList = renderList;
    </script>
</body>
</html>
